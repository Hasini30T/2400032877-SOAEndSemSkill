spring.application.name=soa-tourist-token-validation
server.port=8080

# ---- MySQL (override with environment variables DB_USERNAME / DB_PASSWORD if you like) ----
spring.datasource.url=jdbc:mysql://localhost:3306/tourism_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Hasini
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Pre-generated valid token (placeholder for local testing; override with APP_TOKEN) ----
app.security.token=${APP_TOKEN:TOURIST-TEST-TOKEN-12345}

# ---- Swagger UI ----
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
